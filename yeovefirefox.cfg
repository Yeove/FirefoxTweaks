// yeovefirefox.cfg - Firefox skips the first line of this file, so keep this comment here.
//
// Minimal userChrome.js loader (no third-party code).
// 1. Registers <profile>\chrome\chrome.manifest, which maps
//    chrome://yeovefirefox/content/  ->  <profile>\chrome\JS\
//    (Firefox refuses to run privileged scripts from plain file:/// paths.)
// 2. Every time a browser window finishes starting up, loads every
//    *.uc.js file in <profile>\chrome\JS\ into that window.

try {
    const dirSvc = Cc["@mozilla.org/file/directory_service;1"].getService(Ci.nsIProperties);
    const obsSvc = Cc["@mozilla.org/observer-service;1"].getService(Ci.nsIObserverService);
    const loader = Cc["@mozilla.org/moz/jssubscript-loader;1"].getService(Ci.mozIJSSubScriptLoader);

    const chromeDir = dirSvc.get("UChrm", Ci.nsIFile); // <profile>\chrome
    const manifest = chromeDir.clone();
    manifest.append("chrome.manifest");
    const manifestFound = manifest.exists();
    if (manifestFound) {
        Components.manager.QueryInterface(Ci.nsIComponentRegistrar).autoRegister(manifest);
    }

    obsSvc.addObserver({
        observe(win) {
            try {
                if (!manifestFound) {
                    win.console.error("[yeovefirefox.cfg] chrome.manifest not found in " + chromeDir.path);
                    return;
                }
                const jsDir = chromeDir.clone();
                jsDir.append("JS");
                if (!jsDir.exists() || !jsDir.isDirectory()) return;

                const entries = jsDir.directoryEntries;
                let file;
                while ((file = entries.nextFile)) {
                    if (!file.leafName.endsWith(".uc.js")) continue;
                    try {
                        loader.loadSubScriptWithOptions(
                            "chrome://yeovefirefox/content/" + file.leafName,
                            { target: win, ignoreCache: true } // ignoreCache: edits apply on next restart
                        );
                    } catch (e) {
                        win.console.error(`[yeovefirefox.cfg] ${file.leafName} failed:`, e);
                    }
                }
            } catch (e) {
                win.console.error("[yeovefirefox.cfg] loader error:", e);
            }
        }
    }, "browser-delayed-startup-finished");
} catch (e) {}
